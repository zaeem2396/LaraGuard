name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: "8.3"
            laravel: "11.*"
            testbench: "9.*"
          - php: "8.3"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.4"
            laravel: "11.*"
            testbench: "9.*"
          - php: "8.4"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.5"
            laravel: "13.*"
            testbench: "11.*"

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            --no-interaction --no-update --no-scripts
          composer require \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --dev --no-interaction --no-update --no-scripts
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
